<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALL TIME FAVS // EIKKA200</title>
    <link rel="stylesheet" href="homepage.css">
    <style>
        .favs-header {
            padding: 4rem 2rem 2rem;
            text-align: center;
        }

        .favs-header h1 {
            font-size: clamp(2rem, 8vw, 6rem);
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: -0.03em;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            padding: 0.5rem 1rem;
            font-family: var(--font-mono);
            font-size: 1rem;
            color: var(--secondary-color);
            text-decoration: none;
            border: 2px solid var(--secondary-color);
            transition: all 0.2s ease;
        }

        .back-link:hover {
            background: var(--secondary-color);
            color: var(--bg-color);
        }

        .favs-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }

        .album-card {
            border: 4px solid var(--secondary-color);
            padding: 2rem;
            margin-bottom: 2rem;
            background: rgba(24, 14, 227, 0.05);
            transition: all 0.1s ease;
        }

        .album-card:hover {
            border-color: var(--primary-color);
            transform: translate(-5px, -5px);
            box-shadow: 10px 10px 0 var(--primary-color);
            background: #000;
        }

        .album-title {
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
        }

        .album-artist {
            font-family: var(--font-mono);
            color: var(--secondary-color);
            font-size: 1rem;
            margin-bottom: 1rem;
        }
    </style>
    <meta name="keywords" content="Elias Autio, born in Oulu, born 2007">
    <link rel="icon" type="image/jpeg" href="favicon.jpeg">
</head>

<body>
    <div class="noise-bg"></div>
    <div id="canvas-container"></div>

    <div class="favs-header">
        <a href="index.html#about" class="back-link">← BACK TO HOME</a>
        <h1>ALL TIME FAVS</h1>
    </div>

    <div class="favs-container">
        <div class="album-card">
            <div class="album-title">UTOPIA</div>
            <div class="album-artist">TRAVIS SCOTT</div>
        </div>
        <div class="album-card">
            <div class="album-title">LONG.LIVE.A$AP</div>
            <div class="album-artist">A$AP ROCKY</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
