    <style>
        .social-header {
            padding: 4rem 2rem 2rem;
            text-align: center;
        }

        .social-header h1 {
            font-size: clamp(2rem, 8vw, 6rem);
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: -0.03em;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            padding: 0.5rem 1rem;
            font-family: var(--font-mono);
            font-size: 1rem;
            color: var(--secondary-color);
            text-decoration: none;
            border: 2px solid var(--secondary-color);
            transition: all 0.2s ease;
        }

        .back-link:hover {
            background: var(--secondary-color);
            color: var(--bg-color);
        }

        .social-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .social-btn-large {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 2rem;
            background: transparent;
            border: 4px solid var(--primary-color);
            color: var(--text-color);
            text-decoration: none;
            font-family: var(--font-main);
            font-weight: 800;
            font-size: 2.5rem;
            transition: all 0.1s ease;
            text-transform: uppercase;
        }

        .social-btn-large:hover {
            background: var(--primary-color);
            color: var(--bg-color);
            transform: translate(-10px, -10px) skewX(-2deg);
            box-shadow: 15px 15px 0 var(--secondary-color);
        }

        .social-btn-large svg {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
        }

        @media (max-width: 600px) {
            .social-container {
                padding: 1rem;
                gap: 1rem;
            }

            .social-btn-large {
                font-size: 1.2rem;
                padding: 1.2rem;
                gap: 0.8rem;
                border-width: 3px;
            }

            .social-btn-large svg {
                width: 30px;
                height: 30px;
            }
        }
    </style>
</head>
