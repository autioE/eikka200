<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LATEST REVIEWS // EIKKA200</title>
    <link rel="stylesheet" href="homepage.css">
    <style>
        .reviews-header {
            padding: 4rem 2rem 2rem;
            text-align: center;
        }

        .reviews-header h1 {
            font-size: clamp(2rem, 8vw, 6rem);
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: -0.03em;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            padding: 0.5rem 1rem;
            font-family: var(--font-mono);
            font-size: 1rem;
            color: var(--secondary-color);
            text-decoration: none;
            border: 2px solid var(--secondary-color);
            transition: all 0.2s ease;
        }

        .back-link:hover {
            background: var(--secondary-color);
            color: var(--bg-color);
        }

        .reviews-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }

        .review-card {
            border: 4px solid var(--primary-color);
            padding: 2rem;
            margin-bottom: 2rem;
            transition: all 0.1s ease;
            background: transparent;
        }

        .review-card:hover {
            background: var(--primary-color);
            color: var(--bg-color);
            transform: translate(-10px, -10px) skewX(-2deg);
            box-shadow: 15px 15px 0 var(--secondary-color);
        }

        .review-card:hover .review-artist,
        .review-card:hover .review-score,
        .review-card:hover .review-text {
            color: var(--bg-color);
        }

        .review-title {
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .review-artist {
            font-family: var(--font-mono);
            color: var(--secondary-color);
            font-size: 1rem;
            margin-bottom: 1rem;
        }

        .review-score {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary-color);
            font-family: var(--font-mono);
            margin-bottom: 1rem;
        }

        .review-text {
            font-family: var(--font-mono);
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-color);
        }

        .review-date {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--secondary-color);
            margin-top: 1rem;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <div class="noise-bg"></div>
    <div id="canvas-container"></div>

    <div class="reviews-header">
        <a href="index.html#about" class="back-link">← BACK TO HOME</a>
        <h1>LATEST REVIEWS</h1>
    </div>

    <div class="reviews-container" style="text-align: center; margin-top: 10vh;">
        <h2 style="font-size: clamp(3rem, 15vw, 10rem); color: var(--primary-color); font-weight: 900; letter-spacing: -0.05em;">SOON!</h2>
    </div>

    <script src="script.js"></script>
</body>

</html>
