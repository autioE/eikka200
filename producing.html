<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRODUCING // EIKKA200</title>
    <link rel="stylesheet" href="homepage.css">
    <style>
        .producing-header {
            padding: 4rem 2rem 2rem;
            text-align: center;
        }

        .producing-header h1 {
            font-size: clamp(2rem, 8vw, 6rem);
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: -0.03em;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            padding: 0.5rem 1rem;
            font-family: var(--font-mono);
            font-size: 1rem;
            color: var(--secondary-color);
            text-decoration: none;
            border: 2px solid var(--secondary-color);
            transition: all 0.2s ease;
        }

        .back-link:hover {
            background: var(--secondary-color);
            color: var(--bg-color);
        }

        .portfolio-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .work-card {
            border: 4px solid var(--secondary-color);
            padding: 2rem;
            transition: all 0.1s ease;
            background: rgba(24, 14, 227, 0.05);
        }

        .work-card:hover {
            border-color: var(--primary-color);
            transform: translate(-5px, -5px);
            box-shadow: 10px 10px 0 var(--primary-color);
            background: #000;
        }

        .work-title {
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
        }

        .work-type {
            font-family: var(--font-mono);
            color: var(--secondary-color);
            font-size: 0.9rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .work-desc {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            line-height: 1.5;
            color: var(--text-color);
            margin-bottom: 1.5rem;
        }

        .work-tag {
            display: inline-block;
            background: var(--secondary-color);
            color: var(--bg-color);
            padding: 0.2rem 0.5rem;
            font-size: 0.75rem;
            font-family: var(--font-mono);
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .services-section {
            max-width: 1000px;
            margin: 4rem auto;
            padding: 2rem;
            border-top: 4px solid var(--primary-color);
        }

        .services-section h2 {
            font-size: 3rem;
            text-transform: uppercase;
            margin-bottom: 2rem;
            text-align: center;
        }

        .service-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            font-family: var(--font-mono);
        }

        .service-name {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .service-price {
            color: var(--primary-color);
            font-weight: 800;
        }

        .contact-btn {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.8rem 1.5rem;
            font-family: var(--font-mono);
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--bg-color);
            background: var(--primary-color);
            text-decoration: none;
            text-transform: uppercase;
            border: 4px solid var(--primary-color);
            transition: all 0.1s ease;
            cursor: pointer;
        }

        .contact-btn:hover {
            background: transparent;
            color: var(--primary-color);
            transform: translate(-4px, -4px);
            box-shadow: 8px 8px 0 var(--secondary-color);
        }
    </style>
    <meta name="keywords" content="Elias Autio, born in Oulu, born 2007">
    <link rel="icon" type="image/jpeg" href="favicon.jpeg">
</head>

<body>
    <div class="noise-bg"></div>
    <div id="canvas-container"></div>

    <div class="producing-header">
        <a href="index.html#about" class="back-link">← BACK TO HOME</a>
        <h1>PRODUCING</h1>
    </div>

    <div class="portfolio-container">
        <div class="work-card">
            <div class="work-title">anteateronvenus: episode 1</div>
            <p class="work-desc">out now on youtube!</p>
            <div style="margin-bottom: 1rem;">
                <span class="work-tag">TRAP</span>
                <span class="work-tag">INSTRUMENTAL</span>
            </div>
            <a href="https://www.youtube.com/watch?v=C5E_uNry3LM" target="_blank" rel="noopener noreferrer" class="contact-btn">WATCH ON YOUTUBE</a>
        </div>
        <div class="work-card">
            <div class="work-title">###anteateronvenus</div>
            <p class="work-desc">2027</p>
            <div>
                <span class="work-tag">ALBUM</span>
                <span class="work-tag">TRAP</span>
                <span class="work-tag">ALTERNATIVE</span>
                <span class="work-tag">MELODIC</span>
                <span class="work-tag">INSTRUMENTAL</span>
            </div>
        </div>
        <div class="work-card">
            <div class="work-title">WANT TO COLLAB?</div>
            <a href="contact.html" class="contact-btn">CONTACT ME</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
