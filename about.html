<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABOUT ME // EIKKA200</title>
    <link rel="stylesheet" href="homepage.css">
    <style>
        .about-header {
            padding: 4rem 2rem 2rem;
            text-align: center;
        }

        .about-header h1 {
            font-size: clamp(2rem, 8vw, 6rem);
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: -0.03em;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            padding: 0.5rem 1rem;
            font-family: var(--font-mono);
            font-size: 1rem;
            color: var(--secondary-color);
            text-decoration: none;
            border: 2px solid var(--secondary-color);
            transition: all 0.2s ease;
        }

        .back-link:hover {
            background: var(--secondary-color);
            color: var(--bg-color);
        }

        .profile-image-wrapper {
            width: 100%;
            max-width: 300px;
            margin: 0 auto 2rem;
            border: 4px solid var(--primary-color);
            overflow: hidden;
            background: var(--primary-color);
        }

        .profile-image {
            width: 100%;
            height: auto;
            display: block;
            filter: grayscale(0.5) contrast(1.2);
            transition: all 0.3s ease;
        }

        .profile-image:hover {
            filter: grayscale(0) contrast(1);
            transform: scale(1.02);
        }

        .about-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .about-section {
            border: 4px solid var(--primary-color);
            padding: 2.5rem;
            margin-bottom: 3rem;
            background: rgba(227, 14, 14, 0.05);
        }

        .about-section h2 {
            font-size: 2.5rem;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
        }

        .about-text {
            font-family: var(--font-mono);
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--text-color);
        }

        .timeline {
            margin-top: 3rem;
        }

        .timeline-item {
            border-left: 4px solid var(--secondary-color);
            padding-left: 2rem;
            margin-bottom: 2rem;
            position: relative;
        }

        .timeline-item::before {
            content: "";
            position: absolute;
            left: -12px;
            top: 0;
            width: 20px;
            height: 20px;
            background: var(--primary-color);
            border: 4px solid var(--bg-color);
        }

        .timeline-date {
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .timeline-content {
            font-family: var(--font-mono);
            font-size: 1rem;
        }
    </style>
    <meta name="keywords" content="Elias Autio, born in Oulu, born 2007">
    <link rel="icon" type="image/jpeg" href="favicon.jpeg">
</head>

<body>
    <div class="noise-bg"></div>
    <div id="canvas-container"></div>

    <div class="about-header">
        <a href="index.html#about" class="back-link">← BACK TO HOME</a>
        <h1>ABOUT ME</h1>
    </div>

    <div class="about-container">
        <div class="about-section">
            <h2>ELIAS AUTIO</h2>
            <div class="about-text">
                <p>> <strong>NAME:</strong> Elias Autio</p>
                <p>> <strong>BORN:</strong> Oulu, 2007</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
